<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf6f9"/>
      <stop offset="50%" stop-color="#e8b8d8"/>
      <stop offset="100%" stop-color="#c47bb8"/>
    </linearGradient>
  </defs>
  <!-- Soft purple gradient background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- White bowl -->
  <ellipse cx="256" cy="360" rx="190" ry="110" fill="#f6e6f1"/>
  <!-- Left açaí berry -->
  <circle cx="175" cy="245" r="95" fill="#5e305f"/>
  <!-- Right açaí berry (larger, overlapping) -->
  <circle cx="305" cy="225" r="125" fill="#5e305f"/>
  <!-- Small white highlight on left berry -->
  <circle cx="145" cy="215" r="13" fill="#ffffff"/>
  <!-- Sparkle on left -->
  <path d="M145 215 l 0 -12 3.5 8.5 9 0 -7 6.5 2.5 9 -8 -5 -8 5 2.5 -9 -7 -6.5 9 0 z" fill="#ffffff" opacity="0.95" transform="translate(0,0) scale(0.7)"/>
  <!-- Sparkle on right -->
  <path d="M0 -14 L3.5 -3.5 L14 0 L3.5 3.5 L0 14 L-3.5 3.5 L-14 0 L-3.5 -3.5 Z" fill="#ffffff" transform="translate(370 165)"/>
  <!-- Green leaf -->
  <g transform="translate(395 125) rotate(28)">
    <ellipse cx="0" cy="0" rx="42" ry="20" fill="#09b20f"/>
    <path d="M-38 0 Q0 -7 38 0" stroke="#067a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
