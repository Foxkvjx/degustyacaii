name: Atualizar clima do calendário

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar dados de clima de Santo André
        env:
          TZ: America/Sao_Paulo
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          lat, lon = -23.6639, -46.5383
          params = urllib.parse.urlencode({
              'latitude': lat,
              'longitude': lon,
              'daily': 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max',
              'timezone': 'America/Sao_Paulo',
              'forecast_days': 16,
          })
          url = f'https://api.open-meteo.com/v1/forecast?{params}'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          out = Path('public/data/santo-andre-weather.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commitar somente se houver mudança
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/santo-andre-weather.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update Santo Andre weather forecast'
          git push
